aid: medi-assist
name: Medi Assist
description: 'MediBuddy (Medi Assist) is a Bessemer Venture Partners-backed digital
  healthcare platform based in India that lets consumers and corporate health-benefit
  members book online doctor consultations, order lab tests and diagnostic health
  checkups, buy medicines, and access cashless hospitalization and insurance-linked
  care through a single app and website. It operates as a consumer-facing health
  services marketplace; at the time of this enrichment pass it publishes no public
  developer API, developer portal, or machine-readable API specification. This
  profile records what could be verified from the public web surface.'
